name: Build Android

on:
  push:
    branches: [main]
    paths-ignore:
      - 'incoming/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — projet Flutter présent
        run: |
          if [ ! -f pubspec.yaml ] || [ ! -d lib ]; then
            echo "::error::Pas encore de projet Flutter. Upload un ZIP dans incoming/ puis lance Import ZIP."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Inject Firebase Flutter options
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            mkdir -p lib
            printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Inject Android Firebase + keystore
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
          UPCHAT_KEYSTORE_BASE64: ${{ secrets.UPCHAT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "$UPCHAT_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPCHAT_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Android platform
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android . --project-name upchat
          fi

      - name: Build release APK
        env:
          UPCHAT_KEYSTORE_PASSWORD: ${{ secrets.UPCHAT_KEYSTORE_PASSWORD }}
          UPCHAT_KEY_ALIAS: ${{ secrets.UPCHAT_KEY_ALIAS }}
          UPCHAT_KEY_PASSWORD: ${{ secrets.UPCHAT_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          DEFINE=""
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            DEFINE="--dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          fi
          flutter build apk --release $DEFINE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: upchat2-apk
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
