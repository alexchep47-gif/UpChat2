name: Import ZIP & merge features

on:
  push:
    branches: [main]
    paths:
      - 'incoming/**/*.zip'
      - 'incoming/*.zip'
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL de téléchargement direct du ZIP (si fichier > 25 Mo)'
        required: false
        default: ''
      zip_path:
        description: 'Chemin local dans le repo (ex. incoming/upchat2-source.zip)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  import-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UpChat2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtain ZIP (path, push, or URL)
        id: zip
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          ZIP_PATH_INPUT: ${{ github.event.inputs.zip_path }}
        run: |
          set -e
          mkdir -p incoming
          ZIP=""

          # 1) URL fournie manuellement (fichiers > 25 Mo)
          if [ -n "$ZIP_URL" ]; then
            echo "Téléchargement depuis URL…"
            # Google Drive : convertir les liens /file/d/ID/view
            if echo "$ZIP_URL" | grep -q 'drive.google.com'; then
              FILE_ID=$(echo "$ZIP_URL" | sed -n 's/.*\/d\/\([^/]*\).*/\1/p')
              if [ -z "$FILE_ID" ]; then
                FILE_ID=$(echo "$ZIP_URL" | sed -n 's/.*[?&]id=\([^&]*\).*/\1/p')
              fi
              if [ -n "$FILE_ID" ]; then
                ZIP_URL="https://drive.google.com/uc?export=download&id=${FILE_ID}"
                echo "Lien Google Drive normalisé (id=$FILE_ID)"
              fi
            fi
            # curl suit les redirections ; pour Drive parfois un cookie de confirmation est nécessaire
            curl -L --fail --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0" \
              -o incoming/upchat2-source.zip \
              "$ZIP_URL" || {
                # Second essai Drive avec confirm=t
                if echo "$ZIP_URL" | grep -q 'drive.google.com'; then
                  curl -L --fail -A "Mozilla/5.0" \
                    -o incoming/upchat2-source.zip \
                    "${ZIP_URL}&confirm=t" || exit 1
                else
                  exit 1
                fi
              }
            ZIP="incoming/upchat2-source.zip"
            # Vérifie que ce n'est pas une page HTML d'erreur
            if file "$ZIP" | grep -qi 'html\|ascii text'; then
              echo "::error::Le téléchargement a renvoyé une page web, pas un ZIP. Utilise un lien de téléchargement direct."
              head -c 200 "$ZIP" || true
              exit 1
            fi
          # 2) Chemin fourni
          elif [ -n "$ZIP_PATH_INPUT" ] && [ -f "$ZIP_PATH_INPUT" ]; then
            ZIP="$ZIP_PATH_INPUT"
          # 3) ZIP déjà dans incoming/ (upload < 25 Mo)
          else
            ZIP=$(find incoming -type f -name '*.zip' 2>/dev/null | head -1 || true)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Aucun ZIP. Soit upload < 25 Mo dans incoming/, soit Run workflow avec zip_url."
            exit 1
          fi

          SIZE=$(wc -c < "$ZIP")
          echo "ZIP=$ZIP ($SIZE octets)"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Fichier trop petit ($SIZE o) — téléchargement probablement incomplet."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP to workspace
        run: |
          set -e
          ZIP="${{ steps.zip.outputs.zip }}"
          rm -rf /tmp/upchat2-extract
          mkdir -p /tmp/upchat2-extract
          unzip -q "$ZIP" -d /tmp/upchat2-extract

          ROOT=$(find /tmp/upchat2-extract -name 'pubspec.yaml' -not -path '*/.*' | head -1 | xargs dirname || true)
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml introuvable dans le ZIP."
            find /tmp/upchat2-extract -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "Racine Flutter : $ROOT"

          mkdir -p /tmp/preserve
          cp -a incoming /tmp/preserve/ 2>/dev/null || true
          cp -a .github /tmp/preserve/ 2>/dev/null || true
          cp -a README.md /tmp/preserve/ 2>/dev/null || true

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$ROOT"/. .

          rm -rf incoming .github
          cp -a /tmp/preserve/incoming .
          cp -a /tmp/preserve/.github .
          cp -a /tmp/preserve/README.md . 2>/dev/null || true

          # Ne pas committer le gros ZIP s'il a été téléchargé via URL
          find incoming -name '*.zip' -size +20M -delete 2>/dev/null || true

          test -f pubspec.yaml && test -d lib
          echo "Extraction OK"

      - name: Clone upchat (features source)
        run: |
          set -e
          rm -rf /tmp/upchat-src
          git clone --depth 1 https://github.com/alexchep47-gif/upchat.git /tmp/upchat-src
          echo "upchat: $(git -C /tmp/upchat-src rev-parse --short HEAD)"

      - name: Merge features from upchat
        run: |
          set -e
          SRC=/tmp/upchat-src
          DEST="$GITHUB_WORKSPACE"

          PATHS=(
            "lib/features/auth/login_screen.dart"
            "lib/data/services/firebase_auth_service.dart"
            "lib/data/services/internet_service.dart"
            "lib/data/services/storage_service.dart"
            "lib/data/models/message_model.dart"
            "lib/providers/chat_provider.dart"
            "lib/core/theme/app_glass.dart"
            "lib/core/theme/app_theme.dart"
            "lib/core/theme/app_colors.dart"
            "lib/widgets/glass_container.dart"
            "lib/features/chat/chat_screen.dart"
            "lib/features/contacts/contact_detail_screen.dart"
            "lib/core/routes/app_router.dart"
            "lib/main.dart"
            "lib/core/constants/app_constants.dart"
            "lib/firebase_options.dart"
          )

          for d in lib/features/auth lib/features/chat lib/features/contacts \
                   lib/data/services lib/data/models lib/providers \
                   lib/core/theme lib/core/routes lib/core/constants lib/widgets; do
            mkdir -p "$DEST/$d"
          done

          MERGED=0
          for rel in "${PATHS[@]}"; do
            if [ -f "$SRC/$rel" ]; then
              mkdir -p "$(dirname "$DEST/$rel")"
              cp -f "$SRC/$rel" "$DEST/$rel"
              echo "✓ $rel"
              MERGED=$((MERGED + 1))
            fi
          done

          if [ -f "$DEST/pubspec.yaml" ]; then
            for dep in firebase_core firebase_auth google_sign_in provider hive_flutter flutter_secure_storage http uuid intl; do
              if ! grep -qE "^[[:space:]]*${dep}:" "$DEST/pubspec.yaml"; then
                if grep -q '^dependencies:' "$DEST/pubspec.yaml"; then
                  sed -i "/^dependencies:/a\  ${dep}: any" "$DEST/pubspec.yaml"
                  echo "+ $dep"
                fi
              fi
            done
          fi

          mkdir -p "$DEST/docs"
          cat > "$DEST/docs/MERGE_FROM_UPCHAT.md" << EOF
          # Fusion depuis upchat
          - UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Fichiers: $MERGED
          - SHA upchat: $(git -C /tmp/upchat-src rev-parse HEAD)
          EOF
          echo "Fusion: $MERGED fichiers"

      - name: Commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Rien à committer"
          else
            git commit -m "feat: import ZIP + fusion depuis upchat ($(date -u +%Y-%m-%d))"
            git push origin main
          fi

      - name: Trigger APK build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/alexchep47-gif/UpChat2/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}' || true
